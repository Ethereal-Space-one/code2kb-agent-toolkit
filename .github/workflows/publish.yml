name: Publish npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  package:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify release ref
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF#refs/tags/}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build and audit npm package
        run: python3 -B scripts/package_plugins.py --commit "$GITHUB_SHA" --target dsh --output-dir "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v4
        with:
          name: audited-npm-package
          path: ${{ runner.temp }}/package/code2kb-dsh-*.tgz
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: audited-npm-package
          path: ${{ runner.temp }}/package
      - name: Publish audited tarball using Trusted Publishing
        run: |
          shopt -s nullglob
          packages=("$RUNNER_TEMP"/package/code2kb-dsh-*.tgz)
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --ignore-scripts --provenance
