[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code2kb-agent-toolkit"
version = "2.1.0"
description = "An AI agent toolkit for turning source code into evidence-backed knowledge for Q&A."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Ethereal-Space-one"}]
keywords = ["knowledge-base", "ai-agents", "documentation", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/Ethereal-Space-one/code2kb-agent-toolkit"
Repository = "https://github.com/Ethereal-Space-one/code2kb-agent-toolkit"
Issues = "https://github.com/Ethereal-Space-one/code2kb-agent-toolkit/issues"

[project.scripts]
code2kb = "validation.knowledge:main"

[tool.setuptools]
packages = ["validation", "validation.adapters"]
