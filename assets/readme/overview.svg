<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="602" viewBox="0 0 1040 602" role="img" aria-labelledby="title desc"><title id="title">Code2KB Agent Toolkit 工作流程</title><desc id="desc">Pinned source → AI authoring → review → knowledge files → external retrieval → bot answers.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
.bg { fill: #f8fafc; } .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
.accent { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
.external { fill: #fff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
.title { fill: #0f172a; font-size: 30px; font-weight: 650; }
.name { fill: #0f172a; font-size: 23px; font-weight: 650; }
.body { fill: #475569; font-size: 19px; }
.label { fill: #2563eb; font-size: 15px; font-weight: 650; letter-spacing: 1px; }
.note { fill: #475569; font-size: 18px; }
.flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
</style><rect width="1040" height="602" rx="16" class="bg"/><text x="32" y="48" class="title" text-anchor="start">从代码到机器人知识</text><text x="1008" y="47" class="label" text-anchor="end">TOOLKIT</text><text x="32" y="82" class="body" text-anchor="start">AI 提炼与判断，CLI 检查与发布，外部系统检索与问答。</text><rect x="32" y="122" width="288" height="154" rx="12" class="card"/><text x="54" y="151" class="label" text-anchor="start">01 / SOURCE</text><text x="54" y="186" class="name" text-anchor="start">固定源码</text><text x="54" y="221" class="body" text-anchor="start">Git 提交与范围</text><text x="54" y="249" class="body" text-anchor="start">逐项登记入口和缺口</text><rect x="376" y="122" width="288" height="154" rx="12" class="card"/><text x="398" y="151" class="label" text-anchor="start">02 / AGENT</text><text x="398" y="186" class="name" text-anchor="start">AI 取证与写作</text><text x="398" y="221" class="body" text-anchor="start">Skill、证据与结构化事实</text><text x="398" y="249" class="body" text-anchor="start">保留条件、分支和未知</text><rect x="720" y="122" width="288" height="154" rx="12" class="accent"/><text x="742" y="151" class="label" text-anchor="start">03 / CODE2KB</text><text x="742" y="186" class="name" text-anchor="start">审核与发布</text><text x="742" y="221" class="body" text-anchor="start">人工审核或预授权策略</text><text x="742" y="249" class="body" text-anchor="start">可选的外部独立验证者</text><rect x="32" y="368" width="288" height="154" rx="12" class="accent"/><text x="54" y="397" class="label" text-anchor="start">04 / OUTPUT</text><text x="54" y="432" class="name" text-anchor="start">知识文件</text><text x="54" y="467" class="body" text-anchor="start">业务版 / 研发版</text><text x="54" y="495" class="body" text-anchor="start">可选主题检索单元</text><rect x="376" y="368" width="288" height="154" rx="12" class="external"/><text x="398" y="397" class="label" text-anchor="start">05 / EXTERNAL</text><text x="398" y="432" class="name" text-anchor="start">FTS / 向量索引</text><text x="398" y="467" class="body" text-anchor="start">按受众导入相应语料</text><text x="398" y="495" class="body" text-anchor="start">召回正文与出处</text><rect x="720" y="368" width="288" height="154" rx="12" class="external"/><text x="742" y="397" class="label" text-anchor="start">06 / EXTERNAL</text><text x="742" y="432" class="name" text-anchor="start">机器人问答</text><text x="742" y="467" class="body" text-anchor="start">模型依据证据组织回答</text><text x="742" y="495" class="body" text-anchor="start">保留适用条件与未知</text><path d="M320 199H368" class="flow"/><path d="M664 199H712" class="flow"/><path d="M320 445H368" class="flow"/><path d="M664 445H712" class="flow"/><path d="M864 276V322H176V366" class="flow"/><text x="520" y="308" class="note" text-anchor="middle">发布已审核的知识</text><text x="32" y="570" class="note" text-anchor="start">虚线框为外部系统：模型调用、生产索引与机器人部署由使用方负责。</text></svg>
