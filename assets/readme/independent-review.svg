<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="466" viewBox="0 0 1040 466" role="img" aria-labelledby="title desc"><title id="title">独立验证者流程</title><desc id="desc">Prepared candidate → evidence pack → externally run verifier → policy checks → reviewed or draft.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
.bg { fill: #f8fafc; } .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
.accent { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
.external { fill: #fff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
.title { fill: #0f172a; font-size: 30px; font-weight: 650; }
.name { fill: #0f172a; font-size: 23px; font-weight: 650; }
.body { fill: #475569; font-size: 19px; }
.label { fill: #2563eb; font-size: 15px; font-weight: 650; letter-spacing: 1px; }
.note { fill: #475569; font-size: 18px; }
.flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
</style><rect width="1040" height="466" rx="16" class="bg"/><text x="32" y="48" class="title" text-anchor="start">可选：独立验证与策略审核</text><text x="1008" y="47" class="label" text-anchor="end">TOOLKIT</text><text x="32" y="82" class="body" text-anchor="start">选用含验证者要求的策略 1.1；验证者由使用方在工具外运行。</text><rect x="32" y="116" width="232" height="160" rx="12" class="card"/><text x="54" y="145" class="label" text-anchor="start">AUTHOR</text><text x="54" y="180" class="name" text-anchor="start">prepare</text><text x="54" y="215" class="body" text-anchor="start">准备模块候选</text><text x="54" y="243" class="body" text-anchor="start">绑定候选摘要</text><path d="M264 196H278" class="flow"/><rect x="280" y="116" width="232" height="160" rx="12" class="card"/><text x="302" y="145" class="label" text-anchor="start">CODE2KB</text><text x="302" y="180" class="name" text-anchor="start">evidence-pack</text><text x="302" y="215" class="body" text-anchor="start">结论与源码片段</text><text x="302" y="243" class="body" text-anchor="start">复算应查项及摘要</text><path d="M512 196H526" class="flow"/><rect x="528" y="116" width="232" height="160" rx="12" class="external"/><text x="550" y="145" class="label" text-anchor="start">EXTERNAL</text><text x="550" y="180" class="name" text-anchor="start">独立验证者</text><text x="550" y="215" class="body" text-anchor="start">校准后逐项复核</text><text x="550" y="243" class="body" text-anchor="start">返回判定与原因</text><path d="M760 196H774" class="flow"/><rect x="776" y="116" width="232" height="160" rx="12" class="card"/><text x="798" y="145" class="label" text-anchor="start">CODE2KB</text><text x="798" y="180" class="name" text-anchor="start">policy-review</text><text x="798" y="215" class="body" text-anchor="start">核对报告与策略</text><text x="798" y="243" class="body" text-anchor="start">绑定当前候选对象</text><path d="M892 276V302H260V325" class="flow"/><path d="M892 302H780V325" class="flow"/><rect x="32" y="326" width="456" height="60" rx="10" class="accent"/><rect x="552" y="326" width="456" height="60" rx="10" class="card"/><text x="54" y="364" class="name" text-anchor="start">符合策略 → policy_reviewed</text><text x="574" y="364" class="name" text-anchor="start">验证不通过 → 保持 draft</text><text x="32" y="434" class="note" text-anchor="start">报告绑定与校准成绩不等于结论正确；人工审核仍可单独选择。</text></svg>
