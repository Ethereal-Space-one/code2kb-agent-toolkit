<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="602" viewBox="0 0 1040 602" role="img" aria-labelledby="title desc"><title id="title">Code2KB Spec 1.2 workflow</title><desc id="desc">Pinned source → AI authoring → review → knowledge files → external retrieval → bot answers.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", sans-serif; }
.bg { fill: #f8fafc; } .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
.accent { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
.external { fill: #fff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
.title { fill: #0f172a; font-size: 30px; font-weight: 650; }
.name { fill: #0f172a; font-size: 23px; font-weight: 650; }
.body { fill: #475569; font-size: 19px; }
.label { fill: #2563eb; font-size: 15px; font-weight: 650; letter-spacing: 1px; }
.note { fill: #475569; font-size: 18px; }
.flow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
</style><rect width="1040" height="602" rx="16" class="bg"/><text x="32" y="48" class="title" text-anchor="start">From code to bot knowledge</text><text x="1008" y="47" class="label" text-anchor="end">TOOLKIT 1.2.0</text><text x="32" y="82" class="body" text-anchor="start">Agents interpret. The CLI checks and publishes. Consumers retrieve and answer.</text><rect x="32" y="122" width="288" height="154" rx="12" class="card"/><text x="54" y="151" class="label" text-anchor="start">01 / SOURCE</text><text x="54" y="186" class="name" text-anchor="start">Pinned source</text><text x="54" y="221" class="body" text-anchor="start">Git revisions + scope</text><text x="54" y="249" class="body" text-anchor="start">Known gaps recorded</text><rect x="376" y="122" width="288" height="154" rx="12" class="card"/><text x="398" y="151" class="label" text-anchor="start">02 / AGENT</text><text x="398" y="186" class="name" text-anchor="start">AI authoring</text><text x="398" y="221" class="body" text-anchor="start">Skill + evidence + facts</text><text x="398" y="249" class="body" text-anchor="start">Conditions and unknowns</text><rect x="720" y="122" width="288" height="154" rx="12" class="accent"/><text x="742" y="151" class="label" text-anchor="start">03 / CODE2KB</text><text x="742" y="186" class="name" text-anchor="start">Review and release</text><text x="742" y="221" class="body" text-anchor="start">Human or policy review</text><text x="742" y="249" class="body" text-anchor="start">Optional external verifier</text><rect x="32" y="368" width="288" height="154" rx="12" class="accent"/><text x="54" y="397" class="label" text-anchor="start">04 / OUTPUT</text><text x="54" y="432" class="name" text-anchor="start">Knowledge files</text><text x="54" y="467" class="body" text-anchor="start">Business / engineering</text><text x="54" y="495" class="body" text-anchor="start">Optional retrieval units</text><rect x="376" y="368" width="288" height="154" rx="12" class="external"/><text x="398" y="397" class="label" text-anchor="start">05 / EXTERNAL</text><text x="398" y="432" class="name" text-anchor="start">FTS / vector index</text><text x="398" y="467" class="body" text-anchor="start">Audience-specific corpus</text><text x="398" y="495" class="body" text-anchor="start">Retrieve text and sources</text><rect x="720" y="368" width="288" height="154" rx="12" class="external"/><text x="742" y="397" class="label" text-anchor="start">06 / EXTERNAL</text><text x="742" y="432" class="name" text-anchor="start">Bot Q&amp;A</text><text x="742" y="467" class="body" text-anchor="start">Model composes an answer</text><text x="742" y="495" class="body" text-anchor="start">Keep conditions / unknowns</text><path d="M320 199H368" class="flow"/><path d="M664 199H712" class="flow"/><path d="M320 445H368" class="flow"/><path d="M664 445H712" class="flow"/><path d="M864 276V322H176V366" class="flow"/><text x="520" y="308" class="note" text-anchor="middle">Publish reviewed knowledge</text><text x="32" y="570" class="note" text-anchor="start">Dashed boxes: external systems. Model calls and bot deployment are consumer-managed.</text></svg>
